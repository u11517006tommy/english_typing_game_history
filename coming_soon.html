    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #030712;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 100px, rgba(255, 255, 255, 0.9), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 120px 40px, #ffffff, rgba(0,0,0,0)),

            background-repeat: repeat;
            background-size: 1100px 400px;
        }

        .glow-text {
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.7), 0 0 60px rgba(236, 72, 153, 0.4);
        }

        .button-glow {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        .button-glow:hover {
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.7);
        }

<body class="min-h-screen flex items-center justify-center text-white p-6 relative overflow-hidden">

        <!-- 太空火箭圖示 (SVG) -->
        <div class="w-20 h-20 rounded-full bg-purple-950/80 border border-purple-500/40 flex items-center justify-center text-purple-400 shadow-lg shadow-purple-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

            <p class="text-slate-400 text-sm md:text-base max-w-md mx-auto leading-relaxed pt-2">

            </p>
        </div>

        <a href="index.html"

            返回首頁
